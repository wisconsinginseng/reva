name: Build Reva with Live LS220D Sysroot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install ARMv7 Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

    - name: Download and Extract LS220D Sysroot
      run: |
        # 💡 解凍先をシンプルに「/tmp/sysroot」にします
        mkdir -p /tmp/sysroot
        curl -L https://github.com/wisconsinginseng/reva/releases/download/sysroot/ls220d-sysroot.tar.gz -o /tmp/ls220d-sysroot.tar.gz
        
        # 💡 「--strip-components」を使って、tarの中に含まれる余計な親フォルダ階層を無視し、
        # /tmp/sysroot の直下に直接 「lib」や「usr」が来るように綺麗に展開します！
        tar -xzf /tmp/ls220d-sysroot.tar.gz -C /tmp/sysroot --strip-components=3 || tar -xzf /tmp/ls220d-sysroot.tar.gz -C /tmp/sysroot

    - name: Build Reva with CGO and Real Sysroot
      env:
        GOOS: linux
        GOARCH: arm
        GOARM: 7
        CGO_ENABLED: 1
        CC: arm-linux-gnueabihf-gcc
        CXX: arm-linux-gnueabihf-g++
        CGO_CFLAGS: "--sysroot=/tmp/sysroot"
        CGO_LDFLAGS: "--sysroot=/tmp/sysroot"
      run: |
        # 💡 Makefileは完全スルー！
        # Goコンパイラに直接「実機ライブラリを吸って、SQLite3回路を強制溶接しろ」と命じます！
        go build -v -tags "sqlite sqlite_omit_load_extension" -o cmd/revad/revad ./cmd/revad/main

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reva-CGO-PERFECT-pack-ls220d # 💡 混ざらないように名前も完全版に変えます！
        path: |
          cmd/revad/revad
