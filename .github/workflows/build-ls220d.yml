name: Build Reva for LS220D

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # v3.8.0に適したバージョン

      - name: Build Reva Binaries via Makefile
        run: |
          # 32bit ARM用のクロスコンパイル設定
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=arm
          export GOARM=7
          
          # READMEの教え：サーバー(revad)をビルド
          # Makefileが内部で go build を呼ぶ際、上記の環境変数が引き継がれます
          make revad
          
          # READMEの教え：クライアント(reva)も同様に
          make reva
          
          # ビルドされた成果物を Artifact 用の場所にコピー
          # Makefileの仕様上、cmd/revad/revad に生成されるはずです
          cp cmd/revad/revad ./revad-v3.8.0-armv7
          cp cmd/reva/reva ./reva-v3.8.0-armv7

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reva-full-pack-ls220d
          path: |
            revad-v3.8.0-armv7
            reva-v3.8.0-armv7
            examples/**  # ← これを追加！ フォルダごと全部送ります
