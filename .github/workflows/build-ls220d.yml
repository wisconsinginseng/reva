name: Build Reva for LS220D

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # v3.8.0に適したバージョン

      - name: Build Reva Binaries (Server & Client)
        run: |
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=arm
          export GOARM=7
          
          # 1. クライアントをビルド（既成品）
          go build -o reva-v3.8.0-armv7 ./cmd/reva
          
          # 2. サーバー（本丸）をビルド！
          # ※ ここが今回の「リベンジ」の核心です
          go build -o revad-v3.8.0-armv7 ./cmd/revad

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reva-full-pack-ls220d
          path: |
            reva-v3.8.0-armv7
            revad-v3.8.0-armv7
